<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thrift Score</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><p class="eyebrow">SECONDHAND FIND DIARY</p><div class="hero"><div><h1>Thrift Score <span>✦</span></h1><p>Every great find deserves its moment in the cabinet.</p></div><button class="primary" id="open-add">+ Log a find</button></div></header>
<section class="stats" id="stats" aria-label="Collection statistics"></section><section class="collection"><div class="section-heading"><div><p class="eyebrow">THE COLLECTION</p><h2>Your latest treasures</h2></div><nav id="filters" class="filters" aria-label="Filter finds"></nav></div><div id="find-grid" class="find-grid" aria-live="polite"></div></section></main>
<dialog id="add-find-dialog"><form id="add-find-form" novalidate><div class="dialog-head"><div><p class="eyebrow">NEW TROPHY</p><h2>Log your lucky find</h2></div><button type="button" class="icon-button" data-close="add-find-dialog" aria-label="Close">×</button></div><div class="form-grid"><label>Item name*<input name="name" required placeholder="1970s disco jacket"><small data-error="name"></small></label><label>Where found<input name="place" placeholder="Sunday flea market"></label><label>Price paid*<input name="price" type="number" min="0" step="0.01" required placeholder="12"><small data-error="price"></small></label><label>Estimated value<input name="estimatedValue" type="number" min="0" step="0.01" placeholder="48"><small data-error="estimatedValue"></small></label><label>Category<select name="category"><option>Clothing</option><option>Furniture</option><option>Books</option><option>Electronics</option><option>Art</option><option>Kitchenware</option></select></label><label>Date found<input name="foundDate" type="date"></label><label>Emoji visual<input name="emoji" value="✨" maxlength="8"></label><label>Photo URL (optional)<input name="photoUrl" type="url" placeholder="https://..."></label><label class="wide">Story / description<textarea name="description" rows="3" placeholder="The tiny details that made it a score…"></textarea></label></div><div class="form-actions"><button type="button" class="text-button" data-close="add-find-dialog">Cancel</button><button class="primary" id="save-find">Save this score ✦</button></div></form></dialog>
<dialog id="delete-dialog"><form method="dialog" class="confirm"><div class="medallion">!</div><h2>Pass this find along?</h2><p>It will disappear from your diary and totals.</p><div class="form-actions"><button value="cancel" class="text-button">Keep it</button><button value="confirm" class="danger" id="confirm-delete">Remove find</button></div></form></dialog><div id="toast" class="toast" role="status"></div><script type="module" src="js/main.js"></script></body></html>
